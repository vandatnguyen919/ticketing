spring:
  application:
    name: ticketing-backend
  config:
    import: "optional:vault://"
  cloud:
    vault:
      uri: ${VAULT_ADDR:http://127.0.0.1:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN}
      kv:
        enabled: true
        backend: kv
        application-name: ticketing
        default-context: ticketing
  mvc:
    apiversion:
      default: v1
      use:
        path-segment: 1
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing
    username: ticketing
    password: ticketing
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${oauth.github.client-id}
            client-secret: ${oauth.github.client-secret}
            scope:
              - read:user
              - user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          google:
            client-id: ${oauth.google.client-id}
            client-secret: ${oauth.google.client-secret}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
  sql:
    init:
      mode: always

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  security:
    jwt-secret: ${security.jwt-secret}
    jwt-expiration-ms: 3600000
    cookie:
      name: ticketing-token
      path: /api
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: Lax

server:
  port: 8080
  forward-headers-strategy: native

logging:
  level:
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
